name: CyberHeist Autonomous Cloud Architect

on:
  schedule:
    # Runs twice a day at 04:00 UTC (9:30 AM IST) and 16:00 UTC (9:30 PM IST)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CyberHeist Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Autonomous Heist Generation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/cloud_engine.py

      - name: Commit and Push Evolution to Main
        run: |
          git config --global user.name "mohammedtouffeq-droid"
          git config --global user.email "mohammedtouffeq@gmail.com"
          git add missions.json CHANGELOG.md
          if git diff-index --quiet HEAD --; then
            echo "No new mission changes to commit."
          else
            git commit -m "feat(ai): autonomous daily heist expansion [skip ci]"
            git push origin main
          fi
